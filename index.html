<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows Media Player – Outtamnd Beat Catalog</title>
  
  <!-- Webamp Dependency -->
  <script src="https://unpkg.com/webamp@1.5.0/built/webamp.bundle.min.js"></script>
  
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #app-container {
      width: 100%;
      max-width: 1200px;
      padding: 20px;
    }
    #webamp-app {
      width: 100%;
      height: 600px;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="webamp-app"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const appContainer = document.getElementById("webamp-app");

      // Auto-detect and build relative MP3 URLs cleanly
      async function fetchTrackList() {
        // Fallback list / dynamic builder
        // Replace or extend this array with your full track names if needed
        const baseTracks = [
          "turnt",
          "drugs frm egypt",
          "to da moon",
          "gas em up",
          "blast off",
          "sapphire",
          "summertime",
          "limewire",
          "dog pound",
          "gangsta",
          "love story"
        ];

        return baseTracks.map(trackName => {
          // Sanitizes relative path to avoid /undefined or root-domain 404s
          const filename = trackName.toLowerCase().endsWith('.mp3') 
            ? trackName 
            : `${trackName}.mp3`;

          return {
            metaData: {
              artist: "Outtamnd",
              title: trackName.replace('.mp3', '')
            },
            // Direct relative path targeting the uploaded MP3S folder
            url: `./MP3S/${encodeURIComponent(filename)}`
          };
        });
      }

      const tracks = await fetchTrackList();

      if (Webamp.isSupported()) {
        const webamp = new Webamp({
          initialTracks: tracks
        });

        webamp.renderWhenReady(appContainer);
      } else {
        appContainer.innerHTML = "<p>Webamp is not supported on this browser.</p>";
      }
    });
  </script>
</body>
</html>
